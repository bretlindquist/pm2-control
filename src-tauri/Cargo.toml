[package]
name = "pm2-control"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "pm2_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
